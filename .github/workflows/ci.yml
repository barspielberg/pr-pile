name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt on:"; echo "$unformatted"; exit 1
          fi
      # make check runs tests with -short, which skips the live tests that need gh auth.
      - run: make check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.20.0
          install-only: true
      - name: Packaging regressions
        env:
          PILE_REQUIRE_GORELEASER: '1'
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_*.py' -v
          go test ./scripts -count=1 -v
      - run: make release-snapshot
      - name: Smoke-test the Linux archive
        run: |
          mkdir "$RUNNER_TEMP/pile-smoke"
          tar -xzf dist/pile_*_linux_amd64.tar.gz -C "$RUNNER_TEMP/pile-smoke"
          env PATH=/nonexistent PILE_CONFIG=/nonexistent/config.yml "$RUNNER_TEMP/pile-smoke/pile" --version
          env PATH=/nonexistent PILE_CONFIG=/nonexistent/config.yml "$RUNNER_TEMP/pile-smoke/pile" --help
      - uses: actions/upload-artifact@v4
        with:
          name: release-snapshot
          path: |
            dist/*.tar.gz
            dist/checksums.txt

  docs:
    uses: ./.github/workflows/docs-check.yml

  check:
    name: check
    if: ${{ always() }}
    needs: [test, package, docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require every dependency to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/check-ci.py
